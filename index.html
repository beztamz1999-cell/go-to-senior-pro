<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IT System & Network Administrator — 4 Tuần (Theory Behind Practice)</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Sidebar -->
  <aside class="app-sidebar">
    <div class="brand-box">
      <span class="brand-badge">Theory Behind Practice</span>
      <div class="brand-title">IT System & Network Admin</div>
      <div class="brand-sub">Lộ trình cá nhân hóa 4 tuần (24 buổi) — Từ thực chiến đến hiểu nguyên lý</div>
    </div>

    <div class="sidebar-progress">
      <div class="progress-row">
        <span>Tiến độ hoàn thành</span>
        <span id="sidebar-progress-text">0 / 24 buổi (0%)</span>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="sidebar-progress-bar" style="width: 0%"></div>
      </div>
      <div style="display:flex; justify-content:space-between; font-size:11.5px; color:var(--text-muted); margin-top:6px;">
        <span id="sidebar-terms-count">Thuật ngữ 30s: 0/30</span>
        <span id="sidebar-grad-count">Tốt nghiệp: 0/5</span>
      </div>
    </div>

    <div class="nav-section-title">Chế độ học tập</div>
    <ul class="nav-menu">
      <li>
        <button class="nav-btn active" id="nav-dashboard" onclick="app.showView('dashboard')">
          <span>📊</span>
          <span>Tổng Quan & Chẩn Đoán</span>
        </button>
      </li>
      <li>
        <button class="nav-btn" id="nav-blueprint" onclick="app.showView('blueprint')">
          <span>🏗️</span>
          <span>Xây Hệ Thống A–Z (7 Tầng)</span>
        </button>
      </li>
      <li>
        <button class="nav-btn" id="nav-simulators" onclick="app.showView('simulators')">
          <span>🔬</span>
          <span>Mô Phỏng Nguyên Lý</span>
        </button>
      </li>
      <li>
        <button class="nav-btn" id="nav-glossary" onclick="app.showView('glossary')">
          <span>⚡</span>
          <span>30 Thuật Ngữ (30 Giây)</span>
        </button>
      </li>
      <li>
        <button class="nav-btn" id="nav-labs" onclick="app.showView('labs')">
          <span>🖥️</span>
          <span>Phòng Lab & Chuẩn Đầu Ra</span>
        </button>
      </li>
    </ul>

    <div class="nav-section-title">Giáo trình 4 Tuần (24 Buổi)</div>
    <div id="sidebar-weeks-container" style="padding-bottom: 24px;"></div>
  </aside>

  <!-- Main Content -->
  <div class="app-main">
    <header class="topbar">
      <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
        <button class="btn" onclick="app.openLesson(1)" title="Bắt đầu từ Bài 01">
          🎯 Bài 01: IP, Subnet, Gateway, DNS
        </button>
        <button class="btn" onclick="app.showView('blueprint')" style="border-color:var(--accent-emerald); color:var(--accent-emerald);">
          🏗️ Bản Đồ Xây Hệ Thống 7 Tầng
        </button>
        <input
          type="search"
          id="global-search-input"
          placeholder="Tìm nhanh bài học, thuật ngữ (VD: NAT, VLAN, GPO, 169.254, SRV, RAID...)"
          oninput="app.handleSearch(this.value)"
          style="background:var(--bg-elevated); border:1px solid var(--border-color); color:var(--text-main); padding:8px 14px; border-radius:8px; width:320px; max-width:100%; font-size:13px;"
        />
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        <button class="btn" onclick="app.openAiSettingsModal()" id="ai-settings-btn" style="border-color:var(--accent-blue); color:var(--accent-blue);">
          🤖 Cấu hình AI Audit
        </button>
        <button class="btn" onclick="app.toggleTheme()" id="theme-toggle-btn">
          ☀️ Giao diện Sáng/Tối
        </button>
      </div>
    </header>

    <div id="search-results-drawer" style="display:none; max-width:1120px; width:100%; margin:16px auto 0; padding:0 28px;"></div>
    <div id="ai-modal-Root"></div>

    <main class="content-container" id="main-view-container">
      <!-- Dynamic Content Loaded by js/app.js -->
    </main>
  </div>

  <!-- Data Scripts -->
  <script src="js/data/courseMeta.js"></script>
  <script src="js/data/systemBlueprint.js"></script>
  <script src="js/data/week1.js"></script>
  <script src="js/data/week2.js"></script>
  <script src="js/data/week3.js"></script>
  <script src="js/data/week4.js"></script>
  <!-- AI Auditor Engine -->
  <script src="js/aiAuditor.js"></script>
  <!-- Main Application Logic -->
  <script src="js/app.js"></script>
</body>
</html>
